_metadata:
  major_version: 1
display_information:
  name: ThreadLight
  description: Local, read-only legal-hold discovery for ThreadLight
  background_color: "#4A154B"
features:
  bot_user:
    display_name: ThreadLight
    always_online: false
oauth_config:
  redirect_urls:
    - threadlight://oauth/callback
  scopes:
    bot:
      - team:read
    user:
      - admin.legal_holds:read
  pkce_enabled: true
settings:
  org_deploy_enabled: true
  socket_mode_enabled: false
